<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>Proximity of public schools to major bus and skytrain stations</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  </head>

  <body>
    <div id="mapid" style="width: 800px; height: 500px;"></div>
    <div id="consoleMessage"></div>
    <p>Type distance (m), then click a school: <input id="distanceInput" type="number" value="100"></p>
    <script type="module">

      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';
      const originalLog = console.log;

    console.log = function (...messages) {
    originalLog.apply(console, messages);
    const Message = document.getElementById('consoleMessage');

    Message.textContent += messages.join(' ') + '\n';
};
      const map = new maplibregl.Map({
        container: 'mapid',                  
        center: [-123.11, 49.25], 
        zoom: 11,
        style: 'https://tiles.openfreemap.org/styles/positron' 
      });
      
      window.map = map;

      const skytrainStops = 'https://babooneatbanana.github.io/lab2/rapid-transit-stations.geojson';
      const publicSchools = 'https://babooneatbanana.github.io/lab2/public-schools.geojson';
      const busStops = 'https://babooneatbanana.github.io/lab2/99-r4-r5-stops.geojson';

      const schoolMarkerPaint = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#e0781d',
        'circle-opacity': 0.3
      };
      const skytrainMarkerPaint = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#04cc0e',
        'circle-opacity': 0.3
      };
      const busMarkerPaint = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#1d20e0',
        'circle-opacity': 0.3
      };
      const pointMarkerPaint = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#ac1e0f'
      };
      const skytrainWithinPointMarker = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#04cc0e',
      };
      const busWithinPointMarker = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#1d20e0',
      };
      const schoolsWithinPointMarker = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4, 17, 8],
        'circle-color': '#e0781d',
      };
      const skytrainNearestPointMarker = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 6, 17, 10],
        'circle-color': '#04cc0e',
      };
      const busNearestPointMarker = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 6, 17, 10],
        'circle-color': '#1d20e0',
      };
      const schoolNearestPointMarker = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 6, 17, 10],
        'circle-color': '#e0781d',
      };
      
      map.on('load', async function () {
        const skytrainResponse = await fetch(skytrainStops);
        const skytrain_stops = await skytrainResponse.json();

        const busResponse = await fetch(busStops);
        const bus_stops = await busResponse.json();

        const schoolResponse = await fetch(publicSchools);
        const schools = await schoolResponse.json();

        map.addSource('skytrainStops', {
          type: 'geojson',
          data: skytrainStops
        });
        map.addLayer({
          id: 'skytrain-circles',
          type: 'circle',
          source: 'skytrainStops',
          paint: skytrainMarkerPaint
        });
        map.addSource('busStops', {
          type: 'geojson',
          data: busStops
        });
        map.addLayer({
          id: 'bus-circles',
          type: 'circle',
          source: 'busStops',
          paint: busMarkerPaint
        });
        map.addSource('publicSchools', {
          type: 'geojson',
          data: publicSchools
        });
        map.addLayer({
          id: 'school-circles',
          type: 'circle',
          source: 'publicSchools',
          paint: schoolMarkerPaint
        });
        const point = turf.point([-123.11, 49.25]);
        map.addSource('point', {
          type: 'geojson',
          data: point
        });
        map.addLayer({
          id: 'point-circle',
          type: 'circle',
          source: 'point',
          paint: pointMarkerPaint
        });

        const buffered = turf.buffer(point, 100, { units: 'meters' });
        map.addSource('buffered', {
          type: 'geojson',
          data: buffered
        });
        map.addLayer({
          id: 'buffered-fill',
          type: 'fill',
          source: 'buffered',
          paint: { 'fill-color': '#ac1e0f',
'fill-opacity': 0.2 }
        });

        const skytrain_within = turf.pointsWithinPolygon(skytrain_stops, buffered);
        map.addSource('skytrain_within', {
          type: 'geojson',
          data: skytrain_within
        });
        map.addLayer({
          id: 'skytrain-within-circles',
          type: 'circle',
          source: 'skytrain_within',
          paint: skytrainWithinPointMarker
        });
        const bus_within = turf.pointsWithinPolygon(bus_stops, buffered);
        map.addSource('bus_within', {
          type: 'geojson',
          data: bus_within
        });
        map.addLayer({
          id: 'bus-within-circles',
          type: 'circle',
          source: 'bus_within',
          paint: busWithinPointMarker
        });
        const schools_within = turf.pointsWithinPolygon(schools, buffered);
        map.addSource('schools_within', {
          type: 'geojson',
          data: schools_within
        });
        map.addLayer({
          id: 'schools-within-circles',
          type: 'circle',
          source: 'schools_within',
          paint: schoolsWithinPointMarker
        });

        const nearest_skytrain = turf.nearestPoint(point, skytrain_stops, { units: 'meters' });
        map.addSource('nearest_skytrain', {
          type: 'geojson',
          data: nearest_skytrain
        });
        map.addLayer({
          id: 'nearest-skytrain-circle',
          type: 'circle',
          source: 'nearest_skytrain',
          paint: skytrainNearestPointMarker
        });
        const nearest_bus = turf.nearestPoint(point, bus_stops, { units: 'meters' });
        map.addSource('nearest_bus', {
          type: 'geojson',
          data: nearest_bus
        });
        map.addLayer({
          id: 'nearest-bus-circle',
          type: 'circle',
          source: 'nearest_bus',
          paint: busNearestPointMarker
        });
        const nearest_school = turf.nearestPoint(point, schools, { units: 'meters' });
        map.addSource('nearest_school', {
          type: 'geojson',
          data: nearest_school
        });
        map.addLayer({
          id: 'nearest-school-circle',
          type: 'circle',
          source: 'nearest_school',
          paint: schoolNearestPointMarker
        });
        
        map.on('click', function (e) {document.getElementById('consoleMessage').textContent = '';
          const clicked = turf.point([e.lngLat.lng, e.lngLat.lat]);
          const distanceEntry = document.getElementById('distanceInput');
          const distance = Number(distanceEntry.value);
          if (distance <= 0) {
            console.log('Type a distance above 0 metres, then click the map again.');
            return; 
          }
          const clickedBuffer = turf.buffer(clicked, distance, { units: 'meters' });
          map.getSource('point').setData(clicked);
          map.getSource('buffered').setData(clickedBuffer);

          const clickedWithinSkytrain = turf.pointsWithinPolygon(skytrain_stops, clickedBuffer);
          console.log(clickedWithinSkytrain.features.length + ' skytrain stops inside the ' + distance + ' m buffer |');
          map.getSource('skytrain_within').setData(clickedWithinSkytrain);

          const clickedNearestSkytrain = turf.nearestPoint(clicked, skytrain_stops, { units: 'meters' });
          console.log('Nearest skytrain stop: '  + Math.round(clickedNearestSkytrain.properties.distanceToPoint) + ' m away |');
          map.getSource('nearest_skytrain').setData(clickedNearestSkytrain);

          const clickedWithinBus = turf.pointsWithinPolygon(bus_stops, clickedBuffer);
          console.log(clickedWithinBus.features.length + ' rapid or 99 bus stops pairs inside the ' + distance + ' m buffer |');
          map.getSource('bus_within').setData(clickedWithinBus);

          const clickedNearestBus = turf.nearestPoint(clicked, bus_stops, { units: 'meters' });
          console.log('Nearest bus stop pair: '  + Math.round(clickedNearestBus.properties.distanceToPoint) + ' m away |');
          map.getSource('nearest_bus').setData(clickedNearestBus);

          const clickedWithinSchool = turf.pointsWithinPolygon(schools, clickedBuffer);
          console.log(clickedWithinSchool.features.length + ' schools inside the ' + distance + ' m buffer |');
          map.getSource('schools_within').setData(clickedWithinSchool);

          const clickedNearestSchool = turf.nearestPoint(clicked, schools, { units: 'meters' });
          console.log('Nearest school: ' + clickedNearestSchool.properties.school_name + ', ' + Math.round(clickedNearestSchool.properties.distanceToPoint) + ' m away |');
          map.getSource('nearest_school').setData(clickedNearestSchool);
        });
});
    </script>
  </body>
</html>
